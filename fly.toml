# fly.toml app configuration file generated for wca-statbot on 2026-03-25T14:08:06-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'speedcubemuse'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # 'suspend' resumes from a memory snapshot in ~1-2s instead of a full cold
  # boot; billed the same as 'stop' (rootfs storage only). Note the Discord
  # bot is still offline while suspended — only web traffic wakes the machine.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
