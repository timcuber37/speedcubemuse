name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-speedcubemuse
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy website and Discord bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # The root config runs the website and bot as separate process groups.
        # Avoid creating a second bot machine and duplicate Discord sessions.
        run: flyctl deploy --config fly.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
